name: Aplikacja CI

# CI for the app code imported under starling/ (decision D4 = B).
# Trimmed from starling/.github/workflows/ci.yml for a private repo:
# Linux runners only on push and PR (macOS and Windows minutes cost 10x and 2x),
# Node 22 (the CT8 relay host) and 24. The iOS build runs only on manual dispatch.

on:
  push:
    branches: [main]
    paths: ['starling/**', '.github/workflows/aplikacja.yml']
  pull_request:
    paths: ['starling/**', '.github/workflows/aplikacja.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build iOS for the simulator (macOS runner)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: starling
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: QR ground-truth tools (dev-only)
        run: python -m pip install qrcode numpy pillow
      - name: zbar, the independent second reader
        run: sudo apt-get install -y --no-install-recommends zbar-tools
      - name: Vendor sync
        run: npm ci && bash tools/sync-vendor.sh
      - name: Unit tests
        run: node --test test/*.test.mjs

  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No em/en dashes or AI attribution
        run: bash tools/check-clean.sh

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FAMILY_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Notification privacy invariants
        run: bash tools/check-notification-privacy.sh
      - name: Vendor sync
        run: npm ci && bash tools/sync-vendor.sh
      # RELAY_URL (repository secret) becomes the app's default relay and its
      # App Links host; Gradle writes it into the APK's js/build-config.js and
      # never prints it. Empty on pull requests from forks: the APK then asks
      # for a relay on first run (docs/WDROZENIE-CT8.md).
      - name: Build release APK (unsigned)
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          if [ -n "$RELAY_URL" ]; then echo "family relay: set from secrets"; else echo "family relay: not set, the app will ask for one"; fi
          cd android && ./gradlew --no-daemon assembleRelease lint testDebugUnitTest
      - name: Assert only the expected permissions
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          out=$("$AAPT" dump permissions android/app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "$out"
          if echo "$out" | grep -E "uses-permission" \
            | grep -v "android.permission.INTERNET" \
            | grep -v "android.permission.ACCESS_FINE_LOCATION" \
            | grep -v "android.permission.ACCESS_COARSE_LOCATION" \
            | grep -v "android.permission.FOREGROUND_SERVICE" \
            | grep -v "android.permission.FOREGROUND_SERVICE_LOCATION" \
            | grep -v "android.permission.ACCESS_BACKGROUND_LOCATION" \
            | grep -v "android.permission.POST_NOTIFICATIONS" \
            | grep -v "android.permission.RECEIVE_BOOT_COMPLETED" \
            | grep -v "android.permission.WAKE_LOCK" \
            | grep -v "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" \
            | grep -v "android.permission.USE_BIOMETRIC" \
            | grep -v "android.permission.CAMERA" \
            | grep -v "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"; then
            echo "unexpected permission crept into the manifest"; exit 1
          fi
      - name: Sign with the family key (skipped until the secrets exist)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KSPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_B64 != '' && env.KSPW != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/family.jks"
          VERSION=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | cut -d'"' -f2)
          OUT="kidslocation-$VERSION-$FAMILY_BUILD.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/family.jks" --ks-key-alias rodzina --ks-pass env:KSPW \
            --out "$OUT" android/app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$RUNNER_TEMP/family.jks"
          "$APKSIGNER" verify --print-certs "$OUT" | head -3
          # Public: the signing certificate's fingerprint, in the form the
          # relay's ANDROID_CERT_SHA256 setting wants (docs/WDROZENIE-CT8.md).
          FP=$(keytool -printcert -jarfile "$OUT" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          [ -n "$FP" ] || { echo "could not read the signing certificate fingerprint"; exit 1; }
          echo "ANDROID_CERT_SHA256=$FP"
          echo "Relay setting for App Links: \`ANDROID_CERT_SHA256=$FP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "apk=starling/$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=apk-$VERSION-$FAMILY_BUILD" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: starling-release-unsigned
          path: starling/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.apk != ''
        with:
          name: kidslocation-signed
          path: ${{ steps.sign.outputs.apk }}
      - name: Publish the signed APK as a release (main, on push or manual run; for Obtainium)
        if: steps.sign.outputs.apk != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.sign.outputs.tag }}" "$GITHUB_WORKSPACE/${{ steps.sign.outputs.apk }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${{ steps.sign.outputs.tag }}" --notes "Signed family build from $GITHUB_SHA."

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vendor sync
        run: npm ci && bash tools/sync-vendor.sh
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build for the simulator
        run: |
          cd ios && xcodebuild -project Starling.xcodeproj -target Starling \
            -configuration Release -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build
      - name: Only the location and camera prompts, no ATS holes
        run: |
          plist=ios/build/Release-iphonesimulator/Starling.app/Info.plist
          out=$(plutil -p "$plist")
          echo "$out"
          if echo "$out" | grep -E "UsageDescription" | grep -v "NSLocationWhenInUseUsageDescription" | grep -v "NSCameraUsageDescription"; then
            echo "an unexpected permission prompt crept into the manifest"; exit 1
          fi
          if echo "$out" | grep "NSAppTransportSecurity"; then
            echo "an ATS exception crept into the manifest"; exit 1
          fi

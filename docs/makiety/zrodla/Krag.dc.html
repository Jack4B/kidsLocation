<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Krąg</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.h{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.ph[data-theme="light"]{--bg:#F1F4F2;--surface:#FFFFFF;--surface2:#E8EDEA;--ink:#14201C;--ink2:#4B5A54;--line:#D3DBD7;--accent:#0B7A64;--accentInk:#FFFFFF;--accentSoft:#D6EFE8;--sos:#C62B22;--sosInk:#FFFFFF;--warn:#A85A00}
.ph[data-theme="dark"]{--bg:#12141C;--surface:#1C2030;--surface2:#272C41;--ink:#EEF1F6;--ink2:#A9B1C4;--line:#30364C;--accent:#45D9B5;--accentInk:#06251D;--accentSoft:#17372F;--sos:#FF7A6E;--sosInk:#2A0705;--warn:#F0B35A}
</style>
</helmet>
<div style="width:900px;height:924px;box-sizing:border-box;padding:40px;display:flex;gap:40px;background:#B9C1BD">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="ph" data-theme="{{t.name}}" role="group" aria-label="{{t.label}}" style="width:390px;height:844px;position:relative;overflow:hidden;border-radius:32px;background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line);flex:none">

<div class="h" style="position:absolute;left:20px;top:20px;font-size:30px;font-weight:700;line-height:36px">Krąg</div>

<div style="position:absolute;left:16px;top:72px;width:358px;height:150px;box-sizing:border-box;padding:16px;border-radius:24px;background:var(--surface);box-shadow:0 0 0 1px var(--line)">
<div style="display:flex;align-items:center;justify-content:space-between">
<div class="h" style="font-size:18px;font-weight:700">Udostępniam lokalizację</div>
<button role="switch" aria-checked="true" aria-label="Udostępnianie lokalizacji" style="width:52px;height:32px;border-radius:16px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--accentInk)"></span></button>
</div>
<div style="font-size:13.5px;line-height:19px;color:var(--ink2);margin-top:4px;width:300px">Krąg widzi Cię co 15 sekund, także przy wygaszonym ekranie.</div>
<div style="display:flex;margin-top:14px;height:40px;box-sizing:border-box;padding:3px;border-radius:20px;background:var(--surface2)">
<button aria-pressed="true" style="flex:1;border-radius:17px;background:var(--accent);color:var(--accentInk);font-size:14px;font-weight:700">Dokładnie</button>
<button aria-pressed="false" style="flex:1;border-radius:17px;color:var(--ink);font-size:14px;font-weight:600">Okolica, około 1 km</button>
</div>
</div>

<div class="h" style="position:absolute;left:20px;top:240px;font-size:18px;font-weight:700">Osoby</div>
<button style="position:absolute;right:16px;top:232px;height:40px;padding:0 14px 0 10px;border-radius:20px;color:var(--accent);display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Zaproś osobę</button>

<div style="position:absolute;left:16px;top:280px;width:358px;border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden">
<div style="height:56px;display:flex;align-items:center;gap:12px;padding:0 16px">
<div class="h" style="width:36px;height:36px;border-radius:50%;background:#F29BB8;color:#14201C;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">M</div>
<div style="flex:1"><div style="font-size:15px;font-weight:600">Marta</div><div style="font-size:13px;color:var(--ink2)">W domu</div></div>
<div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>Potwierdzona</div></div>
<div style="height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-top:1px solid var(--line)">
<div class="h" style="width:36px;height:36px;border-radius:50%;background:#F5C04A;color:#14201C;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">K</div>
<div style="flex:1"><div style="font-size:15px;font-weight:600">Kuba</div><div style="font-size:13px;color:var(--ink2)">W szkole</div></div>
<div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--warn)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M12 8.5v4M12 15.5v.01"/></svg>Porównaj numer</div></div>
<div style="height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-top:1px solid var(--line)">
<div class="h" style="width:36px;height:36px;border-radius:50%;background:#B7A6F5;color:#14201C;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">H</div>
<div style="flex:1"><div style="font-size:15px;font-weight:600">Hela</div><div style="font-size:13px;color:var(--ink2)">Brak sygnału od 3 h</div></div>
<div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--warn)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M12 8.5v4M12 15.5v.01"/></svg>Porównaj numer</div></div>
</div>

<div class="h" style="position:absolute;left:20px;top:464px;font-size:18px;font-weight:700">Prywatność</div>
<div style="position:absolute;left:16px;top:498px;width:358px;border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden">
<button style="width:100%;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
<span style="flex:1;font-size:15px;font-weight:600">Blokada aplikacji</span><span style="font-size:14px;color:var(--ink2)">Odcisk palca</span></button>
<button style="width:100%;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left;border-top:1px solid var(--line)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
<span style="flex:1;font-size:15px;font-weight:600">Historia na telefonie</span><span style="font-size:14px;color:var(--ink2)">1 godzina</span></button>
<button style="width:100%;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left;border-top:1px solid var(--line)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7v.01M7 17v.01"/></svg>
<span style="flex:1;font-size:15px;font-weight:600">Serwer</span><span style="font-size:14px;color:var(--accent);font-weight:600">Własny, działa</span></button>
<button style="width:100%;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left;border-top:1px solid var(--line)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>
<span style="flex:1;font-size:15px;font-weight:600">Wygeneruj nowe klucze</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<button style="position:absolute;left:16px;top:716px;width:358px;height:44px;border-radius:22px;color:var(--sos);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 0 0 1.5px var(--sos)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Wyczyść dane z tego telefonu</button>

<div style="position:absolute;left:0;top:764px;width:390px;height:80px;background:var(--surface);border-top:1px solid var(--line);display:flex">
<button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;font-size:12.5px;font-weight:500;color:var(--ink2)">
<span style="width:64px;height:32px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></span>Mapa</button>
<button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;font-size:12.5px;font-weight:500;color:var(--ink2)">
<span style="position:relative;width:64px;height:32px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
<span style="position:absolute;left:34px;top:-2px;min-width:18px;height:18px;box-sizing:border-box;padding:0 5px;border-radius:9px;background:var(--sos);color:var(--sosInk);font-size:11.5px;font-weight:700;line-height:18px;text-align:center">2</span></span>Czat</button>
<button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;font-size:12.5px;font-weight:500;color:var(--ink2)">
<span style="width:64px;height:32px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg></span>Miejsca</button>
<button aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;font-size:12.5px;font-weight:700;color:var(--ink)">
<span style="width:64px;height:32px;border-radius:16px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 4.5 2.2 4.5 5"/></svg></span>Krąg</button>
</div>

</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":924}}'>
class Component extends DCLogic {
renderVals() {
return { themes: [{ name: 'light', label: 'Motyw jasny' }, { name: 'dark', label: 'Motyw ciemny' }] };
}
}
</script>
</body>
</html>

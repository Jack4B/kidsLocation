# XcodeGen spec: `xcodegen generate` writes Starling.xcodeproj from this
# file, so the project itself never has to live in git. Build steps and the
# honest capability story: docs/IOS.md.
name: Starling
options:
  bundleIdPrefix: app.starlingmap
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  Starling:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The same app/ the website and the Android wrapper ship, bundled as a
      # folder reference so every file rides along unmodified.
      - path: ../app
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Blisko
        # Polish is the language this build speaks; system dialogs follow it.
        CFBundleDevelopmentRegion: pl
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Read to your circle only, only while the app is open, and iOS asks
        # you first. The wrapper cannot read location in the background at
        # all; the string promises no more than the platform allows.
        NSLocationWhenInUseUsageDescription: Blisko udostępnia twoją lokalizację kręgowi tylko wtedy, gdy aplikacja jest otwarta. Jest zaszyfrowana tak, że odczyta ją tylko twój krąg.
        # Only when you tap "Scan theirs" on a safety number. Frames go to the
        # decoder in the page and nowhere else; nothing is saved or sent.
        NSCameraUsageDescription: Blisko używa aparatu tylko do zeskanowania kodu numeru bezpieczeństwa, który ktoś ci pokazuje. Nic nie jest zapisywane ani wysyłane.
        # Standard WebCrypto algorithms only; exempt, nothing proprietary.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.starlingmap.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
